
name: CRM Backend Keepalive

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Ping Render backend
        env:
          BACKEND_URL: "https://crm-2q45.onrender.com"
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --max-time 30 \
            "${BACKEND_URL}/api/render"

          echo "CRM backend responded successfully."
